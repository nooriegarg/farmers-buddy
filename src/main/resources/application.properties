# =============================================
# Farmers Buddy - Application Configuration
# =============================================

spring.application.name=farmers-buddy
server.port=8080

# =============================================
# H2 In-Memory Database (no MySQL install needed)
# =============================================
spring.datasource.url=jdbc:h2:mem:farmers_buddy_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =============================================
# JWT Configuration
# =============================================
app.jwt.secret=FarmersBuddySecretKey2024ThisIsAVeryLongSecretKeyForHS256AlgorithmUsedInJWT
app.jwt.expiration-ms=86400000

# =============================================
# Logging
# =============================================
logging.level.com.farmersbuddy=INFO
logging.level.org.springframework.security=WARN