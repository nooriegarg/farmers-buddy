# =============================================================
# application.properties — Spring Boot Application Configuration
# =============================================================
# Central configuration file for the Farmers Buddy backend.
# Spring Boot auto-reads this file on startup to configure:
#   - Application name
#   - MySQL database connection
#   - JPA / Hibernate ORM behavior
#   - Embedded server port
# =============================================================

spring.application.name=farmers-buddy-backend

# -------------------------------------------------------------
# Database Configuration
# -------------------------------------------------------------
# JDBC URL pointing to the local MySQL instance and database.
# If the database does not exist, create it manually first:
#   CREATE DATABASE farmers_buddy_db;
spring.datasource.url=jdbc:mysql://localhost:3306/farmers_buddy_db
spring.datasource.username=root
spring.datasource.password=root123

# -------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------
# ddl-auto=update: Hibernate will auto-create or update tables
# based on entity class definitions. No manual SQL DDL needed.
spring.jpa.hibernate.ddl-auto=update

# show-sql=true: Prints every SQL query Hibernate executes to
# the console. Useful for debugging and understanding JPA behavior.
spring.jpa.show-sql=true

# format_sql=true: Formats the printed SQL for better readability
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------
# The Spring Boot server runs on port 8080.
# The React frontend (port 5173/5174) communicates with this port.
server.port=8080
